<body>
    <div class="app-container" style="max-width: 672px; margin: 0 auto;">
        <div class="header" style="margin-bottom: 16px;">
            <div style="display: flex; align-items: center;">
                <img src="assets/icons/qqshow_icon.PNG" alt="QQ logo" style="width: 40px; height: 40px; border-radius: 4px; margin-right: 8px;" onerror="this.style.display='none'">
                <h1 style="font-weight: bold; font-size: 36px;">QQ秀2000</h1>
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="header-btn" style="display: flex; align-items: center; justify-content: center;" onclick="location.reload()">
                    <i class="fas fa-redo"></i>
                </button>
                <button class="header-btn" style="display: flex; align-items: center; justify-content: center;" onclick="window._doRandom()">
                    <i class="fas fa-download"></i>
                </button>
            </div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 0 22px;">
            <div style="display: flex; gap: 2px; border-radius: 0; box-shadow: 0 0 0 3px #ffffff, 0 0 0 6px #084293, 2px 2px 4px rgba(0,0,0,0.2); width: 210.5px; height: 63px;">
                <div class="tab-wrapper">
                    <button class="tab-button active" data-gender="female">
                        <i class="fas fa-venus" style="font-size: 14px; margin-right: 4px;"></i> 女生
                    </button>
                </div>
                <div class="tab-wrapper">
                    <button class="tab-button" data-gender="male">
                        <i class="fas fa-mars" style="font-size: 14px; margin-right: 4px;"></i> 男生
                    </button>
                </div>
            </div>
            <div class="button-wrapper">
                <button class="random-button" style="padding: 8px 24px; font-weight: bold;" onclick="window._doRandom()">随机搭配</button>
            </div>
        </div>
        <div class="avatar-frame" style="padding: 16px; margin-bottom: 8px; margin-left: 16px; margin-right: 16px;" id="previewFrame"></div>
        <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 0; padding: 0 8px 0 16px; max-height: 130px; overflow-y: auto;" id="categoryBar"></div>
        <div class="hair-panel" style="margin-left: 16px; margin-right: 16px; margin-bottom: 16px;">
            <div class="hair-header">
                <h2 style="font-weight: bold; font-size: 32px;" id="panelTitle">发型</h2>
                <button class="clear-btn" style="display: flex; align-items: center;" onclick="window._doClear()">
                    <i class="fas fa-trash" style="margin-right: 4px;"></i> 清空
                </button>
            </div>
            <div class="hair-content">
                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;" id="itemGrid"></div>
            </div>
        </div>
    </div>
    <script>
        var fs = require('fs');
        var path = require('path');
        var LAYER_ORDER = {
            'backgrounds': 0, 'background-decor': 1, 'vehicle': 2, 'wings': 3,
            'back-hair': 4, 'bottom': 5, 'top': 7, 'outfit': 8, 'makeup': 9,
            'head-set': 10, 'front-hair': 11, 'neckwear': 11, 'earrings': 12,
            'face-decor': 13, 'glasses': 14, 'headwear': 15, 'other-accessories': 16,
            'frame': 17, 'text': 18, 'companion': 19, 'sparkle': 20
        };
        var CATEGORIES = [
            { id: 'backgrounds', name: '背景' },
            { id: 'front-hair', name: '发型' },
            { id: 'top', name: '上衣' },
            { id: 'bottom', name: '下装' },
            { id: 'outfit', name: '套装' },
            { id: 'other-accessories', name: '配饰' },
            { id: 'text', name: '文字' },
            { id: 'back-hair', name: '后发' },
            { id: 'background-decor', name: '背饰' },
            { id: 'headwear', name: '帽子' },
            { id: 'glasses', name: '眼镜' },
            { id: 'head-set', name: '头饰' },
            { id: 'earrings', name: '耳环' },
            { id: 'neckwear', name: '颈饰' },
            { id: 'face-decor', name: '脸饰' },
            { id: 'makeup', name: '妆容' },
            { id: 'companion', name: '伴侣' },
            { id: 'vehicle', name: '载具' },
            { id: 'wings', name: '翅膀' },
            { id: 'sparkle', name: '闪光' },
            { id: 'frame', name: '相框' },
            { id: 'fonts', name: '字体' }
        ];
        var currentGender = 'female';
        var currentCategory = 'backgrounds';
        var selections = {};
        var assetCache = {};
        function loadAssets(categoryId) {
            if (assetCache[categoryId]) return assetCache[categoryId];
            var dir = path.join(__dirname, 'assets', categoryId);
            if (!fs.existsSync(dir)) { assetCache[categoryId] = []; return []; }
            var files = fs.readdirSync(dir).filter(function(f) { return f.endsWith('.gif') || f.endsWith('.png'); });
            var defaults = files.filter(function(f) { return f.indexOf('default') === 0; });
            var others = files.filter(function(f) { return f.indexOf('default') !== 0; });
            assetCache[categoryId] = defaults.concat(others);
            return assetCache[categoryId];
        }
        function buildTabs() {
            var bar = document.getElementById('categoryBar');
            bar.innerHTML = '';
            CATEGORIES.forEach(function(cat) {
                var wrapper = document.createElement('div');
                wrapper.className = 'category-wrapper';
                var btn = document.createElement('button');
                btn.className = 'category-button' + (cat.id === currentCategory ? ' active' : '');
                btn.textContent = cat.name;
                btn.addEventListener('click', function() { selectCategory(cat.id); });
                wrapper.appendChild(btn);
                bar.appendChild(wrapper);
            });
        }
        function selectCategory(categoryId) {
            currentCategory = categoryId;
            var btns = document.querySelectorAll('.category-button');
            CATEGORIES.forEach(function(cat, i) {
                if (btns[i]) btns[i].classList.toggle('active', cat.id === categoryId);
            });
            var cat = CATEGORIES.find(function(c) { return c.id === categoryId; });
            if (cat) document.getElementById('panelTitle').textContent = cat.name;
            renderItems();
        }
        function selectItem(categoryId, file) {
            selections[categoryId] = file;
            if (categoryId === 'outfit') { delete selections['top']; delete selections['bottom']; }
            if (categoryId === 'top' || categoryId === 'bottom') { delete selections['outfit']; }
            if (categoryId === 'front-hair') {
                var backFile = file.replace('front-hair', 'back-hair');
                if (fs.existsSync(path.join(__dirname, 'assets', 'back-hair', backFile))) { selections['back-hair'] = backFile; }
                else { delete selections['back-hair']; }
            }
            if (categoryId === 'back-hair') {
                var frontFile = file.replace('back-hair', 'front-hair');
                if (fs.existsSync(path.join(__dirname, 'assets', 'front-hair', frontFile))) { selections['front-hair'] = frontFile; }
                else { delete selections['front-hair']; }
            }
            renderItems();
            renderAvatar();
        }
        function renderItems() {
            var grid = document.getElementById('itemGrid');
            grid.innerHTML = '';
            var files = loadAssets(currentCategory);
            files.forEach(function(file) {
                var isDefault = file.indexOf('default') === 0;
                var option = document.createElement('div');
                option.className = 'hair-option' + (selections[currentCategory] === file ? ' selected' : '');
                var inner = document.createElement('div');
                inner.className = 'hair-inner';
                var imgDiv = document.createElement('div');
                imgDiv.className = 'hair-img';
                var img = document.createElement('img');
                img.src = path.join(__dirname, 'assets', currentCategory, file);
                imgDiv.appendChild(img);
                inner.appendChild(imgDiv);
                var label = document.createElement('div');
                label.className = 'label';
                label.textContent = isDefault ? '无' : file.replace(/\.(gif|png)$/, '');
                inner.appendChild(label);
                option.appendChild(inner);
                option.addEventListener('click', function() { selectItem(currentCategory, file); });
                grid.appendChild(option);
            });
        }
        function clearCategory() { initSelections(); renderItems(); renderAvatar(); }
        function renderAvatar() {
            var frame = document.getElementById('previewFrame');
            frame.innerHTML = '';
            Object.keys(LAYER_ORDER).forEach(function(catId) {
                if (!selections[catId]) return;
                var div = document.createElement('div');
                div.className = 'qq-show-layer';
                div.style.zIndex = LAYER_ORDER[catId];
                var img = document.createElement('img');
                img.src = path.join(__dirname, 'assets', catId, selections[catId]);
                div.appendChild(img);
                frame.appendChild(div);
            });
        }
        function randomOutfit() {
            selections = {};
            CATEGORIES.forEach(function(cat) {
                var files = loadAssets(cat.id);
                var nonDefault = files.filter(function(f) { return f.indexOf('default') !== 0; });
                if (nonDefault.length > 0) {
                    selections[cat.id] = nonDefault[Math.floor(Math.random() * nonDefault.length)];
                } else if (files.length > 0) {
                    selections[cat.id] = files[0];
                }
            });
            if (selections['front-hair']) {
                var backFile = selections['front-hair'].replace('front-hair', 'back-hair');
                if (fs.existsSync(path.join(__dirname, 'assets', 'back-hair', backFile))) {
                    selections['back-hair'] = backFile;
                }
            }
            renderItems();
            renderAvatar();
        }
        function initSelections() {
            selections = {};
            CATEGORIES.forEach(function(cat) {
                var files = loadAssets(cat.id);
                var defaultFile = files.find(function(f) { return f.indexOf('default') === 0; });
                if (defaultFile) selections[cat.id] = defaultFile;
            });
        }
        window._doRandom = randomOutfit;
        window._doClear = clearCategory;
        document.querySelectorAll('.tab-button').forEach(function(tab) {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab-button').forEach(function(t) { t.classList.remove('active'); });
                tab.classList.add('active');
                currentGender = tab.getAttribute('data-gender');
                assetCache = {};
                initSelections();
                renderItems();
                renderAvatar();
            });
        });
        buildTabs();
        initSelections();
        renderItems();
        renderAvatar();
    </script>
</body>
</html>
